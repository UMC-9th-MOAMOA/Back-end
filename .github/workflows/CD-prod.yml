name: CD - Deploy to EC2 (Docker Compose v2)

on:
  push:
    branches: [ "main" ]

jobs:
  build_push_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle Wrapper
        run: ./gradlew clean build -x test --no-daemon

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build & Push Docker image (latest + sha)
        run: |
          IMAGE="${{ secrets.DOCKER_HUB_USERNAME }}/moamoa-backend"
          SHA_TAG="${GITHUB_SHA::7}"

          docker build -t "${IMAGE}:latest" -t "${IMAGE}:${SHA_TAG}" .
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${SHA_TAG}"

      - name: Deploy on EC2 (docker compose pull/up)
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/moamoa-prod

            docker compose -f docker-compose.prod.yml --env-file .env pull
            docker compose -f docker-compose.prod.yml --env-file .env up -d

            docker image prune -af || true
