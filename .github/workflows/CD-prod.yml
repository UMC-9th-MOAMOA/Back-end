name: CD - Deploy to EC2 (Docker Compose v2)

on:
  push:
    branches: [ "main" ]

jobs:
  build_push_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build bootJar (app.jar)
        run: ./gradlew clean bootJar -x test --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build & Push Docker image (latest + sha)
        run: |
          IMAGE="${{ secrets.DOCKER_HUB_USERNAME }}/moamoa-backend"
          SHA_TAG="${GITHUB_SHA::7}"

          docker build -t "${IMAGE}:latest" -t "${IMAGE}:${SHA_TAG}" .
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${SHA_TAG}"

      - name: Deploy on EC2 (docker compose pull/up + healthcheck)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/app

            APP_TAG="${{ github.sha }}"
            APP_TAG="${APP_TAG:0:7}"
            export APP_TAG

            docker compose -f docker-compose.yml --env-file .env pull
            docker compose -f docker-compose.yml --env-file .env up -d

            echo "Waiting for actuator health..."
            ok=false

            for i in $(seq 1 30); do
              code=$(curl -s -o /tmp/health.json -w "%{http_code}" \
                --connect-timeout 2 --max-time 5 \
                http://localhost:8080/actuator/health || true)

              if [ "$code" = "200" ] && grep -q '"status":"UP"' /tmp/health.json; then
                echo "Health OK: $(cat /tmp/health.json)"
                ok=true
                break
              fi

              echo "Not ready yet (code=$code) retry $i/30... body=$(cat /tmp/health.json 2>/dev/null || true)"
              sleep 2
            done

            if [ "$ok" != "true" ]; then
              echo "Health check FAILED. Showing logs..."
              docker compose -f docker-compose.yml logs --tail=200 || true
              # 컨테이너명 고정이면 이것도 추가로
              docker logs --tail 200 moamoa-app || true
              exit 1
            fi

            docker image prune -af || true
      
