name: "♻️ 리팩토링"
description: "백엔드 구조 개선 / 리팩토링 이슈"
title: "[Refactor] "
labels: ["refactor"]
body:
  - type: textarea
    id: reason
    attributes:
      label: 리팩토링 사유
      description: 왜 이 리팩토링이 필요한가요?
      placeholder: |
        예) Service 레이어 비대화
        예) 도메인 책임이 불명확함
        예) 중복 로직 다수 존재
    validations:
      required: true

  - type: textarea
    id: target
    attributes:
      label: 대상 범위
      description: 리팩토링 대상 클래스/패키지/모듈
      placeholder: |
        예) user.domain / UserService
        예) inquiry.api / inquiry.application
    validations:
      required: true

  - type: textarea
    id: approach
    attributes:
      label: 리팩토링 방향
      description: 어떻게 개선할 계획인가요?
      placeholder: |
        예) 도메인 로직 분리
        예) Mapper 계층 도입
        예) Service → UseCase 구조로 변경
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 완료 조건 (DoD)
      placeholder: |
        - [ ] 기존 API 동작 동일
        - [ ] 테스트/빌드 통과
        - [ ] 주요 도메인 책임 명확화
    validations:
      required: true

  - type: input
    id: related
    attributes:
      label: 관련 이슈 / PR
      placeholder: "예) #42, PR #57"
    validations:
      required: false
