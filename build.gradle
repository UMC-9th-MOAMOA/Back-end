plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'MOAMOA_Backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    /* ===============================
     * Core Spring Boot
     * =============================== */
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    /* ===============================
     * Database
     * =============================== */
    runtimeOnly 'com.mysql:mysql-connector-j'

    /* ===============================
     * Lombok
     * =============================== */
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    /* ===============================
     * QueryDSL - OpenFeign 포크 (최신 버전, 활발한 개발)
     * =============================== */
    implementation "io.github.openfeign.querydsl:querydsl-jpa:7.1"
    implementation "io.github.openfeign.querydsl:querydsl-core:7.1"
    annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:7.1:jpa"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"

    /* ===============================
     * Swagger (OpenAPI) - Spring Boot 4.0 지원
     * =============================== */
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.1'

    /* ===============================
     * Validation
     * =============================== */
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    /* ===============================
     * Security
     * =============================== */
    implementation 'org.springframework.boot:spring-boot-starter-security'
    testImplementation 'org.springframework.security:spring-security-test'

    /* ===============================
     * JWT
     * =============================== */
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    /* ===============================
     * OAuth2
     * =============================== */
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    /* ===============================
     * Redis
     * =============================== */
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    /* ===============================
     * 이메일 전송 (JavaMail / SMTP)
     * =============================== */
    implementation 'org.springframework.boot:spring-boot-starter-mail'

}

tasks.named('test') {
    useJUnitPlatform()
}