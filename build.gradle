plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'MOAMOA_Backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

bootJar {
    archiveFileName = "app.jar"
}


repositories {
    mavenCentral()
}

dependencies {
    /* ===============================
     * Core Spring Boot
     * =============================== */
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    /* ===============================
     * Database
     * =============================== */
    runtimeOnly 'com.mysql:mysql-connector-j'

    /* ===============================
     * Lombok
     * =============================== */
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    /* ===============================
     * QueryDSL - OpenFeign 포크 (최신 버전, 활발한 개발)
     * =============================== */
    implementation "io.github.openfeign.querydsl:querydsl-jpa:7.1"
    implementation "io.github.openfeign.querydsl:querydsl-core:7.1"
    annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:7.1:jakarta"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"

    /* ===============================
     * Swagger (OpenAPI) - Spring Boot 4.0 지원
     * =============================== */
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.1'

    /* ===============================
     * Validation
     * =============================== */
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    /* ===============================
     * Security
     * =============================== */
    implementation 'org.springframework.boot:spring-boot-starter-security'
    testImplementation 'org.springframework.security:spring-security-test'

    /* ===============================
     * JWT
     * =============================== */
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    /* ===============================
     * OAuth2
     * =============================== */
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    /* ===============================
     * Redis
     * =============================== */
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    /* ===============================
     * 이메일 전송 (JavaMail / SMTP)
     * =============================== */
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    
    /* ===============================
     * Actuator (Health Check)
     * =============================== */
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    /* ===============================
     * S3
     * =============================== */
    implementation platform("software.amazon.awssdk:bom:2.25.61")
    implementation "software.amazon.awssdk:s3"

    /* ===============================
    * csv 파일 읽기
    * =============================== */
    implementation 'org.apache.commons:commons-csv:1.10.0'

    /* ===============================
   * Flyway
   * =============================== */
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'

}

tasks.named('test') {
    useJUnitPlatform()
}

// QueryDSL 관련 설정
// generated/querydsl 폴더 생성 & 삽입
def querydslDir = layout.buildDirectory.dir("generated/querydsl").get().asFile

// 소스 세트에 생성 경로 추가 (구체적인 경로 지정)
sourceSets {
    main.java.srcDirs += [ querydslDir ]
}

// 컴파일 시 생성 경로 지정
tasks.withType(JavaCompile).configureEach {
    options.generatedSourceOutputDirectory.set(querydslDir)
}

// clean 태스크에 생성 폴더 삭제 로직 추가
clean.doLast {
    file(querydslDir).deleteDir()
}

