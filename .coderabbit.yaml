# ===== Global =====
language: "ko-KR"                       # 리뷰/응답 언어: 한국어
tone_instructions: "편안하고 협업 친화적인 톤으로, 개선 제안 위주로 리뷰합니다."
early_access: false
enable_free_tier: true

# ===== Reviews =====
reviews:
  profile: chill                        # 기본 톤: chill
  request_changes_workflow: false       # CodeRabbit이 승인/RC 흐름을 주도하지 않음

  high_level_summary: true              # PR 상단 요약 항상 생성
  review_status: true
  commit_status: true
  fail_commit_status: false

  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: false              # 과도한 시각화는 끔

  suggested_labels: true                # 라벨 추천만
  auto_apply_labels: false              # 자동 적용 ❌
  suggested_reviewers: true             # 리뷰어 추천만
  auto_assign_reviewers: false          # 자동 지정 ❌

  poem: true                            # 가끔 가벼운 재미 요소 허용 🙂

  # 백엔드 핵심만 리뷰
path_filters:
  include:
    - "src/main/java/**"
    - "src/test/java/**"
    - "src/main/resources/**"
    - "build.gradle"
    - "build.gradle.kts"
  exclude:
    - "**/generated/**"
    - "**/build/**"
    - "**/.gradle/**"
    - "**/node_modules/**"



    # ===== Auto Review =====
auto_review:
  enabled: true
  auto_incremental_review: true          # 새 커밋 시
  drafts: false                          # Draft PR은 리뷰 안 함
  base_branches:                         # 기준 브랜치
    - main
    - develop

# ===== Tools (기본만) =====
tools:
  gitleaks:
    enabled: true                        # 비밀정보 유출 검사
  eslint:
    enabled: true
  pmd:
    enabled: true                        # Java 기본 정적 분석
  markdownlint:
    enabled: true

# ===== Code Generation =====
code_generation:
  docstrings:
    enabled: false                       # 자동 주석 생성 ❌
  unit_tests:
    enabled: false                       # 자동 테스트 생성 ❌
