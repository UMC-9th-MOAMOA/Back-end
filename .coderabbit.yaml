# ===== Global =====
language: "ko-KR"
tone_instructions: "편안하고 협업 친화적인 톤으로, 개선 제안 위주로 리뷰합니다."
early_access: false
enable_free_tier: true

# ===== Reviews =====
reviews:
  profile: chill
  request_changes_workflow: false

  high_level_summary: true
  review_status: true
  commit_status: true
  fail_commit_status: false

  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: false

  suggested_labels: true
  auto_apply_labels: false
  suggested_reviewers: true
  auto_assign_reviewers: false

  poem: true

  # 백엔드 핵심만 리뷰
  path_filters:
    include:
      - "src/main/java/**"
      - "src/test/java/**"
      - "src/main/resources/**"
      - "build.gradle"
      - "build.gradle.kts"
    exclude:
      - "**/generated/**"
      - "**/build/**"
      - "**/.gradle/**"
      - "**/node_modules/**"


    # ===== Auto Review =====
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches:
      - main
      - develop

# ===== Tools (기본만) =====
tools:
  gitleaks:
    enabled: true
  eslint:
    enabled: true
  pmd:
    enabled: true
  markdownlint:
    enabled: true

# ===== Code Generation =====
code_generation:
  docstrings:
    enabled: false
  unit_tests:
    enabled: false
